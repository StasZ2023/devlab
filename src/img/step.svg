<svg width="320" height="90" viewBox="0 0 320 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Оранжево-красный градиент -->
    <linearGradient id="orangeGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d4769"/>
      <stop offset="100%" stop-color="#27355e"/>
    </linearGradient>

    <!-- Лёгкая тень -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Фигура стрелки -->
  <polygon points="0,15 290,15 320,45 290,75 0,75 0,45"
           fill="url(#orangeGradient)"
           filter="url(#shadow)"
           stroke="black"
           stroke-width="2"/>
</svg>
